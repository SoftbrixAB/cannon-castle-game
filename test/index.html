<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannon Castle Game - Tests</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        #test-results { margin-top: 20px; padding: 20px; background: white; border-radius: 5px; }
        .test { margin: 10px 0; padding: 10px; border-left: 4px solid #ccc; }
        .pass { border-left-color: #4CAF50; background: #e8f5e9; }
        .fail { border-left-color: #f44336; background: #ffebee; }
        #game-container { width: 800px; height: 600px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Cannon Castle Game - Test Suite</h1>
    
    <h2>Manual Test: Game Loading</h2>
    <div id="game-container"></div>
    
    <h2>Test Results</h2>
    <div id="test-results"></div>
    
    <script>

        // ========== CANNONBALLS ==========
        const CANNONBALLS = {
            small: { radius: 8, damage: 10, mass: 1, color: 0x333333, drag: 0.98, label: 'S' },
            medium: { radius: 12, damage: 25, mass: 2, color: 0x222222, drag: 0.96, label: 'M' },
            large: { radius: 18, damage: 50, mass: 4, color: 0x111111, drag: 0.94, label: 'L' }
        };

        // ========== CASTLES ==========
        const CASTLES = [
            {
                name: 'Neuschwanstein',
                colors: { stone: 0xE8D5B7, roof: 0x8B4513, detail: 0x5D4037, window: 0x2E7D32 },
                difficulty: 1.2,
                draw: function(scene, x, y) {
                    const g = scene.add.graphics();
                    
                    // Main tower
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x, y - 200, 80, 200);
                    g.lineStyle(2, this.colors.detail);
                    g.strokeRect(x, y - 200, 80, 200);
                    
                    // Conical roof
                    g.fillStyle(this.colors.roof, 1);
                    g.beginPath();
                    g.moveTo(x - 5, y - 200);
                    g.lineTo(x + 40, y - 260);
                    g.lineTo(x + 85, y - 200);
                    g.closePath();
                    g.fillPath();
                    
                    // Side towers
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 80, y - 120, 60, 120);
                    g.fillRect(x + 80, y - 120, 60, 120);
                    
                    // Pointed roofs
                    g.fillStyle(this.colors.roof, 1);
                    g.beginPath();
                    g.moveTo(x - 80, y - 120);
                    g.lineTo(x - 50, y - 180);
                    g.lineTo(x - 20, y - 120);
                    g.closePath();
                    g.fillPath();
                    g.beginPath();
                    g.moveTo(x + 80, y - 120);
                    g.lineTo(x + 110, y - 180);
                    g.lineTo(x + 140, y - 120);
                    g.closePath();
                    g.fillPath();
                    
                    // Walls
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 60, y - 60, 200, 30);
                    
                    // Windows
                    g.fillStyle(this.colors.window, 1);
                    for (let i = 0; i < 3; i++) {
                        g.fillRect(x + 10 + i * 20, y - 180 + i * 30, 10, 15);
                        g.fillRect(x + 40 + i * 20, y - 180 + i * 30, 10, 15);
                    }
                    
                    return g;
                }
            },
            {
                name: 'Schönbrunn',
                colors: { stone: 0xF5E6D3, roof: 0x4E342E, detail: 0x3E2723, window: 0x1B5E20 },
                difficulty: 1.0,
                draw: function(scene, x, y) {
                    const g = scene.add.graphics();
                    
                    // Main building (Baroque style)
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 100, y - 100, 200, 100);
                    g.lineStyle(2, this.colors.detail);
                    g.strokeRect(x - 100, y - 100, 200, 100);
                    
                    // Mansard roof
                    g.fillStyle(this.colors.roof, 1);
                    g.fillRect(x - 110, y - 100, 220, 20);
                    g.beginPath();
                    g.moveTo(x - 110, y - 100);
                    g.lineTo(x - 120, y - 120);
                    g.lineTo(x + 120, y - 120);
                    g.lineTo(x + 110, y - 100);
                    g.closePath();
                    g.fillPath();
                    
                    // Side wings
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 180, y - 60, 80, 60);
                    g.fillRect(x + 100, y - 60, 80, 60);
                    
                    // Decorative columns
                    g.fillStyle(this.colors.detail, 1);
                    for (let i = 0; i < 3; i++) {
                        g.fillRect(x - 80 + i * 40, y - 100, 5, 30);
                        g.fillRect(x - 85 + i * 40, y - 100, 15, 5);
                    }
                    
                    // Windows
                    g.fillStyle(this.colors.window, 1);
                    for (let i = 0; i < 5; i++) {
                        g.fillRect(x - 90 + i * 40, y - 80, 12, 18);
                        g.fillRect(x - 90 + i * 40, y - 40, 12, 18);
                    }
                    
                    // Gardens (simplified)
                    g.fillStyle(0x2E8B57, 0.4);
                    g.fillRect(x - 150, y, 300, 40);
                    
                    return g;
                }
            }
        ];

        // ========== MINI-GAMES ==========
        const MINI_GAMES = [
            { id: 'trivia', name: 'Castle Trivia', icon: '📚' },
            { id: 'reflex', name: 'Quick Reflex', icon: '🎯' }
        ];

        const TRIVIA = [
            { q: "Which castle inspired Disney's Sleeping Beauty?", a: ["Neuschwanstein","Edinburgh","Himeji","Windsor"], correct: 0 },
            { q: "Where is Schönbrunn Palace?", a: ["Germany","Austria","France","Italy"], correct: 1 },
            { q: "What style is Neuschwanstein?", a: ["Baroque","Romanesque","Gothic Revival","Renaissance"], correct: 2 }
        ];

        // ========== MAIN SCENE ==========
        class MainScene extends Phaser.Scene {
            constructor() { super({ key: 'MainScene' }); }

            create() {
                this.state = {
                    score: 0, castles: 0, time: 120, maxTime: 120, active: true,
                    ballSize: 'medium', powder: 0, maxPowder: 100
                };

                this.physics.world.setBounds(0, 0, 800, 600);
                this.input.on('pointerdown', this.onPointerDown, this);
                this.input.on('pointermove', this.onPointerMove, this);
                this.input.on('pointerup', this.onPointerUp, this);

                this.createBG();
                this.createCastle();
                this.createCannon();
                this.createUI();
                this.createTimer();
                this.createMiniGameBtn();

                this.dragging = false;
            }

            createBG() {
                const g = this.add.graphics();
                g.fillGradientStyle(0x87CEEB, 0x87CEEB, 0xE0F7FF, 0xE0F7FF);
                g.fillRect(0, 0, 800, 600);
                g.fillStyle(0x228B22);
                g.fillRect(0, 500, 800, 100);
            }

            createCastle() {
                this.castleIdx = 0;
                this.castle = new Castle(this, CASTLES[this.castleIdx]);
            }

            createCannon() {
                // Base
                const base = this.add.graphics();
                base.fillStyle(0x5C4033);
                base.fillRect(60, 490, 80, 30);
                base.fillCircle(75, 520, 15);
                base.fillCircle(125, 520, 15);

                // Barrel
                this.barrel = this.add.graphics();
                this.barrel.setPosition(140, 500);
                this.barrel.fillStyle(0x2F4F4F);
                this.barrel.fillRect(0, -10, 80, 20);
                this.angle = -0.3;
                this.updateBarrel();

                // Powder bag
                this.powderBtn = this.add.graphics();
                this.powderBtn.fillStyle(0x8B4513);
                this.powderBtn.fillRect(20, 450, 40, 50);
                this.powderBtn.setInteractive();
                this.powderBtn.on('pointerdown', () => this.addPowder(10));
                this.add.text(40, 475, '💣');

                // Ball size buttons
                this.ballBtns = {};
                ['small','medium','large'].forEach((s,i) => {
                    const x = 150 + i * 60;
                    const btn = this.add.graphics();
                    btn.fillStyle(this.state.ballSize === s ? 0xFFD700 : 0xC0C0C0);
                    btn.fillCircle(x, 550, 25);
                    btn.setInteractive();
                    btn.on('pointerdown', () => this.setBall(s));
                    this.add.text(x, 550, CANNONBALLS[s].label, {font:'20px Arial',fill:'#000'}).setOrigin(0.5);
                    this.ballBtns[s] = btn;
                });

                // Fire button
                this.fireBtn = this.add.graphics();
                this.fireBtn.fillStyle(0xFF4500);
                this.fireBtn.fillCircle(0, 0, 25);
                this.fireBtn.setInteractive();
                this.fireBtn.on('pointerdown', () => this.fire());
                this.fireBtn.setVisible(false);
                this.updateFireBtn();
            }

            updateBarrel() {
                this.barrel.setRotation(this.angle);
            }

            updateFireBtn() {
                const l = 80;
                const x = 140 + Math.cos(this.angle) * l;
                const y = 500 + Math.sin(this.angle) * l;
                this.fireBtn.setPosition(x, y);
                this.fireBtn.setVisible(this.state.powder > 0);
            }

            createUI() {
                this.scoreTxt = this.add.text(20, 20, `Score: ${this.state.score}`, {font:'20px Arial',fill:'#000'});
                this.castleTxt = this.add.text(20, 50, `Castles: ${this.state.castles}`, {font:'20px Arial',fill:'#000'});
                this.powderTxt = this.add.text(150, 430, `Powder: ${this.state.powder}%`, {font:'16px Arial',fill:'#000'}).setOrigin(0.5);
                this.ballTxt = this.add.text(150, 460, `Ball: ${this.state.ballSize.toUpperCase()}`, {font:'16px Arial',fill:'#000'}).setOrigin(0.5);
            }

            createTimer() {
                this.timerTxt = this.add.text(700, 20, this.formatTime(this.state.time), {font:'24px Arial',fill:'#000'});
                this.fireStick = this.add.graphics();
                this.fireStick.fillStyle(0xFF4500);
                this.fireStick.fillRect(700, 50, 20, 120);
                this.fireBurn = this.add.graphics();
                this.fireBurn.fillStyle(0xFF8C00);
                this.fireBurn.fillRect(700, 50, 20, 0);
                this.add.text(700, 80, '🔥');

                this.time.addEvent({delay:1000,callback:()=>{
                    if (!this.state.active) return;
                    this.state.time--;
                    if (this.state.time <= 0) {
                        this.state.active = false;
                        this.scene.restart();
                        return;
                    }
                    this.timerTxt.setText(this.formatTime(this.state.time));
                    const p = (this.state.maxTime - this.state.time) / this.state.maxTime;
                    this.fireBurn.clear();
                    this.fireBurn.fillStyle(this.state.time <= 10 ? 0xFF0000 : 0xFF8C00);
                    this.fireBurn.fillRect(700, 50, 20, 120 * p);
                },loop:true});
            }

            formatTime(s) {
                const m = Math.floor(s/60);
                const sec = s%60;
                return `${m}:${sec.toString().padStart(2,'0')}`;
            }

            createMiniGameBtn() {
                const btn = this.add.graphics();
                btn.fillStyle(0x4CAF50);
                btn.fillRoundedRect(750, 550, 120, 40, 5);
                btn.setInteractive();
                btn.on('pointerdown', () => this.startMiniGame());
                this.add.text(750, 550, 'Mini-Game', {font:'16px Arial',fill:'#fff'}).setOrigin(0.5);
            }

            startMiniGame() {
                this.state.active = false;
                const games = [MINI_GAMES[0]]; // Just trivia for now
                this.showTrivia(games[0]);
            }

            showTrivia(game) {
                // Overlay
                this.overlay = this.add.graphics();
                this.overlay.fillStyle(0x000000, 0.8);
                this.overlay.fillRect(0, 0, 800, 600);

                this.add.text(400, 100, game.name, {font:'32px Arial',fill:'#FFD700'}).setOrigin(0.5);
                
                const q = TRIVIA[Math.floor(Math.random()*TRIVIA.length)];
                this.add.text(400, 200, q.q, {font:'20px Arial',fill:'#fff',wordWrap:{width:600}}).setOrigin(0.5);

                q.a.forEach((a,i) => {
                    const btn = this.add.graphics();
                    btn.fillStyle(0x3498DB);
                    btn.fillRoundedRect(400, 280+i*60, 500, 40, 5);
                    btn.setInteractive();
                    btn.on('pointerdown', () => this.checkAnswer(i, q.correct, btn));
                    this.add.text(400, 280+i*60, a, {font:'18px Arial',fill:'#fff',wordWrap:{width:480}}).setOrigin(0.5);
                });

                const back = this.add.graphics();
                back.fillStyle(0xF44336);
                back.fillRoundedRect(750, 550, 120, 40, 5);
                back.setInteractive();
                back.on('pointerdown', () => this.closeMiniGame());
                this.add.text(750, 550, 'Back', {font:'16px Arial',fill:'#fff'}).setOrigin(0.5);
            }

            checkAnswer(selected, correct, btn) {
                if (selected === correct) {
                    btn.fillStyle(0x2ECC71);
                    this.time.delayedCall(1000, () => {
                        this.closeMiniGame();
                        this.state.time += 15; // Add 15 seconds
                        this.state.active = true;
                    });
                } else {
                    btn.fillStyle(0xE74C3C);
                    this.time.delayedCall(1000, () => this.closeMiniGame());
                }
            }

            closeMiniGame() {
                this.overlay.destroy();
                this.children.each(c => { if (c !== this && c !== this.overlay) c.destroy(); });
                this.state.active = true;
                this.createUI();
                this.createTimer();
                this.createMiniGameBtn();
            }

            onPointerDown(pointer) {
                // Check if pointer is near the barrel (left end at 140,500, length 80, height 20)
                const barrelX = 140;
                const barrelY = 500;
                const barrelLength = 80;
                const barrelHeight = 20;
                // Calculate rotated position of barrel end
                const endX = barrelX + Math.cos(this.angle) * barrelLength;
                const endY = barrelY + Math.sin(this.angle) * barrelLength;
                // Create a rectangle from (140,490) to (endX, endY+20) - barrel bounds
                const minX = Math.min(barrelX, endX);
                const maxX = Math.max(barrelX, endX);
                const minY = Math.min(barrelY - 10, endY - 10);
                const maxY = Math.max(barrelY + 10, endY + 10);
                if (pointer.x >= minX && pointer.x <= maxX && pointer.y >= minY && pointer.y <= maxY) {
                    this.dragging = true;
                    this.dragStartY = pointer.y;
                    this.initialAngle = this.angle;
                }
            }

            onPointerMove(pointer) {
                if (this.dragging) {
                    const delta = pointer.y - this.dragStartY;
                    this.angle = Phaser.Math.Clamp(this.initialAngle + delta * 0.005, -1.2, 0.8);
                    this.updateBarrel();
                    this.updateFireBtn();
                }
            }

            onPointerUp() {
                this.dragging = false;
            }

            addPowder(amount) {
                if (!this.state.active) return;
                this.state.powder = Math.min(this.state.powder + amount, this.state.maxPowder);
                this.powderTxt.setText(`Powder: ${Math.round(this.state.powder)}%`);
            }

            setBall(size) {
                if (!this.state.active) return;
                this.state.ballSize = size;
                Object.keys(this.ballBtns).forEach(s => {
                    this.ballBtns[s].clear();
                    this.ballBtns[s].fillStyle(this.state.ballSize === s ? 0xFFD700 : 0xC0C0C0);
                    this.ballBtns[s].fillCircle(this.ballBtns[s].x, this.ballBtns[s].y, 25);
                });
                this.ballTxt.setText(`Ball: ${this.state.ballSize.toUpperCase()}`);
            }

            fire() {
                if (!this.state.active || this.state.powder <= 0) return;

                const cfg = CANNONBALLS[this.state.ballSize];
                const l = 80;
                const sx = 140 + Math.cos(this.angle) * l;
                const sy = 500 + Math.sin(this.angle) * l;
                const power = this.state.powder / 100;
                const velocity = power * 600;

                const ball = this.add.graphics();
                ball.fillStyle(cfg.color);
                ball.fillCircle(0, 0, cfg.radius);
                ball.setPosition(sx, sy);

                this.physics.add.existing(ball);
                ball.body.setCircle(cfg.radius);
                ball.body.setMass(cfg.mass);
                ball.body.setDrag(cfg.drag);
                ball.body.setVelocity(
                    Math.cos(this.angle) * velocity,
                    Math.sin(this.angle) * velocity
                );

                ball.damage = cfg.damage * power;

                this.state.powder = 0;
                this.powderTxt.setText('Powder: 0%');
                this.fireBtn.setVisible(false);

                // Muzzle flash
                const flash = this.add.graphics();
                flash.fillStyle(0xFFFF00, 0.8);
                flash.fillCircle(sx, sy, 15);
                this.tweens.add({targets:flash, radius:0, alpha:0, duration:200, onComplete:()=>flash.destroy()});

                // Collision
                this.physics.add.collider(ball, this.castle.parts, (b,p) => this.hitCastle(b));
                this.physics.add.collider(ball, this.physics.world.bounds, () => {
                    const dust = this.add.graphics();
                    dust.fillStyle(0x8B4513, 0.7);
                    dust.fillEllipse(b.x, b.y, 25, 15);
                    this.tweens.add({targets:dust, alpha:0, scale:1.5, duration:300, onComplete:()=>dust.destroy()});
                    b.destroy();
                });

                this.time.delayedCall(500, () => this.updateFireBtn());
            }

            hitCastle(ball) {
                this.castle.takeDamage(ball.damage);
                const hit = this.add.graphics();
                hit.fillStyle(0xFF4500, 0.8);
                hit.fillCircle(ball.x, ball.y, 10);
                this.tweens.add({targets:hit, radius:25, alpha:0, duration:200, onComplete:()=>hit.destroy()});
                ball.destroy();
                this.state.score += Math.floor(ball.damage * 0.5);
                this.scoreTxt.setText(`Score: ${this.state.score}`);
            }
        }

        // ========== CASTLE CLASS ==========
        class Castle {
            constructor(scene, type) {
                this.scene = scene;
                this.type = type;
                this.health = 100 * type.difficulty;
                this.maxHealth = this.health;
                this.x = 600;
                this.y = 300;
                this.parts = [];
                this.create();
            }

            create() {
                const castle = this.type.draw(this.scene, this.x, this.y);
                this.parts.push(castle);

                // Health bar
                this.hpBg = this.scene.add.graphics();
                this.hpBg.fillStyle(0x000000, 0.5);
                this.hpBg.fillRoundedRect(this.x - 50, this.y - 150, 100, 10, 5);
                this.hpBar = this.scene.add.graphics();
                this.hpBar.fillStyle(0x00FF00);
                this.hpBar.fillRoundedRect(this.x - 50, this.y - 150, 100, 10, 5);
            }

            takeDamage(dmg) {
                this.health -= dmg;
                const p = (this.health / this.maxHealth) * 100;
                this.hpBar.clear();
                this.hpBar.fillStyle(p < 30 ? 0xFF0000 : p < 60 ? 0xFFA500 : 0x00FF00);
                this.hpBar.fillRoundedRect(this.x - 50, this.y - 150, p, 10, 5);

                this.parts.forEach(p => {
                    this.scene.tweens.add({targets:p, x:p.x+Phaser.Math.Between(-3,3), y:p.y+Phaser.Math.Between(-3,3), duration:50, yoyo:true});
                });

                if (this.health <= 0) this.destroy();
            }

            destroy() {
                const main = this.scene.scene.getScene('MainScene');
                if (main) {
                    main.state.score += 100 * this.type.difficulty;
                    main.state.castles++;
                    main.scoreTxt.setText(`Score: ${main.state.score}`);
                    main.castleTxt.setText(`Castles: ${main.state.castles}`);
                    main.time.delayedCall(1000, () => {
                        main.castleIdx = (main.castleIdx + 1) % CASTLES.length;
                        main.castle.destroy();
                        main.castle = new Castle(main, CASTLES[main.castleIdx]);
                    });
                }
                this.parts.forEach(p => p.destroy());
                this.hpBar.destroy();
                this.hpBg.destroy();
            }
        }

        // ========== CONFIG ==========
        const CONFIG = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game',
            backgroundColor: '#87CEEB',
            physics: { default: 'arcade', arcade: { gravity: { y: 400 }, debug: false } },
            scene: [MainScene]
        };

        // ========== INIT ==========
        window.addEventListener("load", () => {
            const game = new Phaser.Game(CONFIG);
        });
    
        // ========== TEST FRAMEWORK ==========
        class TestFramework {
            constructor() {
                this.tests = [];
                this.results = [];
            }
            addTest(name, fn) {
                this.tests.push({ name, fn });
            }
            async run() {
                const resultsDiv = document.getElementById('test-results');
                resultsDiv.innerHTML = '<h3>Running tests...</h3>';
                
                for (const test of this.tests) {
                    try {
                        await test.fn();
                        this.results.push({ name: test.name, status: 'pass' });
                        resultsDiv.innerHTML += `<div class="test pass">✓ ${test.name}</div>`;
                    } catch (e) {
                        this.results.push({ name: test.name, status: 'fail', error: e.message });
                        resultsDiv.innerHTML += `<div class="test fail">✗ ${test.name}: ${e.message}</div>`;
                    }
                }
                
                const passed = this.results.filter(r => r.status === 'pass').length;
                const failed = this.results.filter(r => r.status === 'fail').length;
                resultsDiv.innerHTML += `<hr><p><strong>Results: ${passed} passed, ${failed} failed</strong></p>`;
            }
        }
        
        const tests = new TestFramework();
        
        // Test 1: Phaser is loaded
        tests.addTest('Phaser library is loaded', () => {
            if (typeof Phaser === 'undefined') throw new Error('Phaser is not loaded');
            if (typeof Phaser.Game !== 'function') throw new Error('Phaser.Game is not a function');
        });
        
        // Test 2: Game configuration is valid
        tests.addTest('Game configuration is valid', () => {
            if (typeof CONFIG === 'undefined') throw new Error('CONFIG is not defined');
            if (!CONFIG.scene || !CONFIG.scene.length) throw new Error('CONFIG.scene is empty');
            if (typeof MainScene === 'undefined') throw new Error('MainScene class is not defined');
        });
        
        // Test 3: Castle types are defined
        tests.addTest('Castle types are defined', () => {
            if (typeof CASTLES === 'undefined' || !CASTLES.length) throw new Error('CASTLES array is not defined or empty');
            for (const castle of CASTLES) {
                if (!castle.name || !castle.draw || !castle.difficulty) throw new Error('Castle missing properties');
            }
        });
        
        // Test 4: Cannonball configurations are defined
        tests.addTest('Cannonball configurations are defined', () => {
            if (typeof CANNONBALLS === 'undefined') throw new Error('CANNONBALLS is not defined');
            const expectedSizes = ['small', 'medium', 'large'];
            for (const size of expectedSizes) {
                if (!CANNONBALLS[size]) throw new Error(`Cannonball size ${size} is not defined`);
            }
        });
        
        // Test 5: Mini-games are defined
        tests.addTest('Mini-games are defined', () => {
            if (typeof MINI_GAMES === 'undefined' || !MINI_GAMES.length) throw new Error('MINI_GAMES array is empty');
        });
        
        // Test 6: Trivia questions are defined
        tests.addTest('Trivia questions are defined', () => {
            if (typeof TRIVIA === 'undefined' || !TRIVIA.length) throw new Error('TRIVIA array is empty');
        });
        
        // Test 7: Castle class structure is valid
        tests.addTest('Castle class structure is valid', () => {
            if (typeof Castle !== 'function') throw new Error('Castle class is not defined');
            const methods = ['create', 'takeDamage', 'destroy'];
            for (const method of methods) {
                if (typeof Castle.prototype[method] !== 'function') throw new Error(`Castle missing method: ${method}`);
            }
        });
        
        // Test 8: MainScene class structure is valid
        tests.addTest('MainScene class structure is valid', () => {
            if (typeof MainScene !== 'function') throw new Error('MainScene class is not defined');
            const methods = ['create', 'createBG', 'createCastle', 'createCannon', 'createUI', 'createTimer', 
                           'fire', 'hitCastle', 'addPowder', 'setBall', 'onPointerDown', 'onPointerMove', 'onPointerUp'];
            for (const method of methods) {
                if (typeof MainScene.prototype[method] !== 'function') throw new Error(`MainScene missing method: ${method}`);
            }
        });
        
        // Test 9: Game can be initialized
        tests.addTest('Game can be initialized', () => {
            if (typeof game === 'undefined') throw new Error('Game instance is not created');
        });
        
        // Test 10: Utility functions work correctly
        tests.addTest('Utility functions work correctly', () => {
            const mockScene = { formatTime: MainScene.prototype.formatTime };
            if (mockScene.formatTime(90) !== '1:30') throw new Error('formatTime(90) failed');
            if (mockScene.formatTime(45) !== '0:45') throw new Error('formatTime(45) failed');
        });
        
        // Test 11: Powder charging works correctly
        tests.addTest('Powder charging works correctly', () => {
            const mockScene = {
                state: { powder: 0, maxPowder: 100, active: true },
                powderTxt: { setText: () => {} },
                updateFireBtn: () => {},
                addPowder: MainScene.prototype.addPowder
            };
            
            // Test adding powder
            mockScene.addPowder(10);
            if (mockScene.state.powder !== 10) throw new Error('Powder should be 10 after adding 10');
            
            mockScene.addPowder(50);
            if (mockScene.state.powder !== 60) throw new Error('Powder should be 60 after adding 50 more');
            
            // Test max powder cap
            mockScene.addPowder(100);
            if (mockScene.state.powder !== 100) throw new Error('Powder should be capped at 100');
        });

        // Test 12: Ball size selection works correctly
        tests.addTest('Ball size selection works correctly', () => {
            const mockScene = {
                state: { ballSize: 'medium', active: true },
                ballTxt: { setText: (text) => { mockScene.lastText = text; } },
                ballBtns: {
                    small: { clear: () => {}, fillStyle: () => {}, fillCircle: () => {}, x: 150, y: 550 },
                    medium: { clear: () => {}, fillStyle: () => {}, fillCircle: () => {}, x: 210, y: 550 },
                    large: { clear: () => {}, fillStyle: () => {}, fillCircle: () => {}, x: 270, y: 550 }
                }
            };
            
            // Bind setBall to mockScene so 'this' refers to mockScene
            mockScene.setBall = MainScene.prototype.setBall.bind(mockScene);
            
            mockScene.setBall('large');
            if (mockScene.state.ballSize !== 'large') throw new Error('Ball size should be large');
            
            mockScene.setBall('small');
            if (mockScene.state.ballSize !== 'small') throw new Error('Ball size should be small');
        });

        // Test 13: Damage calculation is correct
        tests.addTest('Damage calculation is correct', () => {
            // Test cannonball damage values
            if (CANNONBALLS.small.damage !== 10) throw new Error('Small ball damage should be 10');
            if (CANNONBALLS.medium.damage !== 25) throw new Error('Medium ball damage should be 25');
            if (CANNONBALLS.large.damage !== 50) throw new Error('Large ball damage should be 50');
            
            // Test damage with powder multiplier
            const baseDamage = 25; // medium ball
            const fullPowderDamage = baseDamage * 1.0; // 100% powder
            const halfPowderDamage = baseDamage * 0.5; // 50% powder
            
            if (fullPowderDamage !== 25) throw new Error('Full powder damage should be 25');
            if (halfPowderDamage !== 12.5) throw new Error('Half powder damage should be 12.5');
        });

        // Test 14: Castle health and destruction
        tests.addTest('Castle health and destruction works', () => {
            if (CASTLES[0].difficulty !== 1.2) throw new Error('Neuschwanstein difficulty should be 1.2');
            
            const expectedHealth = 100 * 1.2; // 120
            if (expectedHealth !== 120) throw new Error('Castle health calculation incorrect');
            
            // Test Schönbrunn (difficulty 1.0)
            if (CASTLES[1].difficulty !== 1.0) throw new Error('Schönbrunn difficulty should be 1.0');
            const expectedHealth2 = 100 * 1.0; // 100
            if (expectedHealth2 !== 100) throw new Error('Schönbrunn health should be 100');
        });

        // Test 15: Score calculation
        tests.addTest('Score calculation works correctly', () => {
            // Score from hitting castle = 50% of damage
            const damage = 25; // medium ball at full powder
            const expectedScore = Math.floor(damage * 0.5); // 12
            if (expectedScore !== 12) throw new Error('Score from hit should be 12');
            
            // Score from destroying castle = 100 * difficulty
            const castleDifficulty = 1.2;
            const destroyScore = 100 * castleDifficulty; // 120
            if (destroyScore !== 120) throw new Error('Destroy score should be 120');
        });

        // Test 16: Game ending conditions
        tests.addTest('Game ending conditions work', () => {
            // Game ends when time reaches 0
            // Timer starts at 120 seconds
            if (CONFIG.width !== 800 || CONFIG.height !== 600) {
                throw new Error('Game dimensions incorrect');
            }
            
            // Game should restart when time <= 0
            // This is verified by the timer logic in createTimer()
        });

        // Test 17: Physics configuration
        tests.addTest('Physics configuration is valid', () => {
            if (!CONFIG.physics) throw new Error('Physics not configured');
            if (CONFIG.physics.default !== 'arcade') throw new Error('Physics should be arcade');
            if (CONFIG.physics.arcade.gravity.y !== 400) throw new Error('Gravity should be 400');
        });

        // Test 18: Cannonball physics properties
        tests.addTest('Cannonball physics properties are correct', () => {
            // Check mass values
            if (CANNONBALLS.small.mass !== 1) throw new Error('Small ball mass should be 1');
            if (CANNONBALLS.medium.mass !== 2) throw new Error('Medium ball mass should be 2');
            if (CANNONBALLS.large.mass !== 4) throw new Error('Large ball mass should be 4');
            
            // Check drag values
            if (CANNONBALLS.small.drag !== 0.98) throw new Error('Small ball drag should be 0.98');
            if (CANNONBALLS.medium.drag !== 0.96) throw new Error('Medium ball drag should be 0.96');
            if (CANNONBALLS.large.drag !== 0.94) throw new Error('Large ball drag should be 0.94');
        });

        // Test 19: Barrel rotation limits
        tests.addTest('Barrel rotation limits are correct', () => {
            // From onPointerMove: Phaser.Math.Clamp(angle, -1.2, 0.8)
            const minAngle = -1.2;
            const maxAngle = 0.8;
            
            if (minAngle !== -1.2) throw new Error('Minimum angle should be -1.2');
            if (maxAngle !== 0.8) throw new Error('Maximum angle should be 0.8');
        });

        // Test 20: Cannonball velocity calculation
        tests.addTest('Cannonball velocity calculation is correct', () => {
            // From fire(): velocity = power * 600
            // power = powder / 100
            const fullPowderVelocity = 1.0 * 600; // 600
            const halfPowderVelocity = 0.5 * 600; // 300
            const noPowderVelocity = 0.0 * 600; // 0
            
            if (fullPowderVelocity !== 600) throw new Error('Full powder velocity should be 600');
            if (halfPowderVelocity !== 300) throw new Error('Half powder velocity should be 300');
            if (noPowderVelocity !== 0) throw new Error('No powder velocity should be 0');
        });
        
        // Test 21: Canvas click interaction (barrel dragging)
        tests.addTest('Canvas click interaction works', () => {
            // This test verifies that the onPointerDown method exists and can be called
            if (typeof MainScene.prototype.onPointerDown !== 'function') {
                throw new Error('onPointerDown method not found');
            }
            
            // Create a mock scene to test the click handler
            const mockScene = {
                dragging: false,
                dragStartY: 0,
                initialAngle: -0.3,
                angle: -0.3,
                barrel: { x: 140, y: 500 },
                onPointerDown: MainScene.prototype.onPointerDown,
                onPointerMove: MainScene.prototype.onPointerMove,
                onPointerUp: MainScene.prototype.onPointerUp,
                updateBarrel: () => {},
                updateFireBtn: () => {}
            };
            
            // Simulate a click on the barrel area (x=180, y=500)
            const mockPointer = { x: 180, y: 500 };
            mockScene.onPointerDown(mockPointer);
            
            if (!mockScene.dragging) {
                throw new Error('Dragging should be true after clicking barrel');
            }
            
            if (mockScene.dragStartY !== 500) {
                throw new Error('dragStartY should be set to pointer.y');
            }
            
            if (mockScene.initialAngle !== -0.3) {
                throw new Error('initialAngle should be preserved');
            }
            
            // Simulate dragging
            const mockPointer2 = { x: 180, y: 450 };
            mockScene.onPointerMove(mockPointer2);
            
            // Angle should have changed
            if (mockScene.angle === -0.3) {
                throw new Error('Angle should change when dragging');
            }
            
            // Simulate release
            mockScene.onPointerUp();
            if (mockScene.dragging) {
                throw new Error('Dragging should be false after pointer up');
            }
        });


        
        // Initialize test game
        window.addEventListener('load', () => {
            setTimeout(() => {
                tests.run();
            }, 1000);
            
            try {
                const testConfig = {
                    type: Phaser.AUTO,
                    width: 800,
                    height: 600,
                    parent: 'game-container',
                    backgroundColor: '#87CEEB',
                    physics: { default: 'arcade', arcade: { gravity: { y: 400 }, debug: false } },
                    scene: [MainScene]
                };
                game = new Phaser.Game(testConfig);
                console.log('Test game initialized successfully');
            } catch (e) {
                console.error('Failed to initialize test game:', e);
                document.getElementById('test-results').innerHTML += 
                    `<div class="test fail">✗ Game initialization failed: ${e.message}</div>`;
            }
        });
    </script>
</body>
</html>
