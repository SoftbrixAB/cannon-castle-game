<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannon Castle Game - Tests</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f0f0; }
        #test-results { margin-top: 20px; padding: 20px; background: white; border-radius: 5px; }
        .test { margin: 10px 0; padding: 10px; border-left: 4px solid #ccc; }
        .pass { border-left-color: #4CAF50; background: #e8f5e9; }
        .fail { border-left-color: #f44336; background: #ffebee; }
        .skip { border-left-color: #ff9800; background: #fff3e0; }
        #game-container { width: 800px; height: 600px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Cannon Castle Game - Test Suite</h1>
    
    <h2>Manual Test: Game Loading</h2>
    <div id="game-container"></div>
    
    <h2>Test Results</h2>
    <div id="test-results"></div>
    
    <script>
        // Test framework
        class TestFramework {
            constructor() {
                this.tests = [];
                this.results = [];
            }
            
            addTest(name, fn) {
                this.tests.push({ name, fn });
            }
            
            async run() {
                const resultsDiv = document.getElementById('test-results');
                resultsDiv.innerHTML = '<h3>Running tests...</h3>';
                
                for (const test of this.tests) {
                    try {
                        await test.fn();
                        this.results.push({ name: test.name, status: 'pass' });
                        resultsDiv.innerHTML += `<div class="test pass">✓ ${test.name}</div>`;
                    } catch (e) {
                        this.results.push({ name: test.name, status: 'fail', error: e.message });
                        resultsDiv.innerHTML += `<div class="test fail">✗ ${test.name}: ${e.message}</div>`;
                    }
                }
                
                const passed = this.results.filter(r => r.status === 'pass').length;
                const failed = this.results.filter(r => r.status === 'fail').length;
                resultsDiv.innerHTML += `<hr><p><strong>Results: ${passed} passed, ${failed} failed</strong></p>`;
            }
        }
        
        const tests = new TestFramework();
        
        // Test 1: Phaser is loaded
        tests.addTest('Phaser library is loaded', () => {
            if (typeof Phaser === 'undefined') {
                throw new Error('Phaser is not loaded');
            }
            if (typeof Phaser.Game !== 'function') {
                throw new Error('Phaser.Game is not a function');
            }
        });
        
        // Test 2: Game configuration is valid
        tests.addTest('Game configuration is valid', () => {
            if (typeof CONFIG === 'undefined') {
                throw new Error('CONFIG is not defined');
            }
            if (!CONFIG.scene || !CONFIG.scene.length) {
                throw new Error('CONFIG.scene is empty');
            }
            if (typeof MainScene === 'undefined') {
                throw new Error('MainScene class is not defined');
            }
        });
        
        // Test 3: Castle types are defined
        tests.addTest('Castle types are defined', () => {
            if (typeof CASTLES === 'undefined' || !CASTLES.length) {
                throw new Error('CASTLES array is not defined or empty');
            }
            for (const castle of CASTLES) {
                if (!castle.name || !castle.draw || !castle.difficulty) {
                    throw new Error(`Castle ${castle.name} is missing required properties`);
                }
            }
        });
        
        // Test 4: Cannonball configurations are defined
        tests.addTest('Cannonball configurations are defined', () => {
            if (typeof CANNONBALLS === 'undefined') {
                throw new Error('CANNONBALLS is not defined');
            }
            const expectedSizes = ['small', 'medium', 'large'];
            for (const size of expectedSizes) {
                if (!CANNONBALLS[size]) {
                    throw new Error(`Cannonball size ${size} is not defined`);
                }
                const cfg = CANNONBALLS[size];
                if (typeof cfg.radius !== 'number' || typeof cfg.damage !== 'number') {
                    throw new Error(`Cannonball ${size} has invalid configuration`);
                }
            }
        });
        
        // Test 5: Mini-games are defined
        tests.addTest('Mini-games are defined', () => {
            if (typeof MINI_GAMES === 'undefined' || !MINI_GAMES.length) {
                throw new Error('MINI_GAMES array is not defined or empty');
            }
            for (const game of MINI_GAMES) {
                if (!game.id || !game.name) {
                    throw new Error(`Mini-game is missing required properties`);
                }
            }
        });
        
        // Test 6: Trivia questions are defined
        tests.addTest('Trivia questions are defined', () => {
            if (typeof TRIVIA === 'undefined' || !TRIVIA.length) {
                throw new Error('TRIVIA array is not defined or empty');
            }
            for (const q of TRIVIA) {
                if (!q.q || !q.a || q.correct === undefined) {
                    throw new Error('Trivia question is missing required properties');
                }
                if (q.a.length < 2) {
                    throw new Error('Trivia question has less than 2 answers');
                }
            }
        });
        
        // Test 7: Castle class can be instantiated (requires mocking)
        tests.addTest('Castle class structure is valid', () => {
            if (typeof Castle !== 'function') {
                throw new Error('Castle class is not defined');
            }
            const castleMethods = ['create', 'takeDamage', 'destroy'];
            for (const method of castleMethods) {
                if (typeof Castle.prototype[method] !== 'function') {
                    throw new Error(`Castle class is missing method: ${method}`);
                }
            }
        });
        
        // Test 8: MainScene class structure is valid
        tests.addTest('MainScene class structure is valid', () => {
            if (typeof MainScene !== 'function') {
                throw new Error('MainScene class is not defined');
            }
            const sceneMethods = [
                'create', 'createBG', 'createCastle', 'createCannon', 
                'createUI', 'createTimer', 'createMiniGameBtn',
                'fire', 'hitCastle', 'addPowder', 'setBall',
                'onPointerDown', 'onPointerMove', 'onPointerUp',
                'updateBarrel', 'updateFireBtn', 'formatTime',
                'startMiniGame', 'showTrivia', 'checkAnswer', 'closeMiniGame'
            ];
            for (const method of sceneMethods) {
                if (typeof MainScene.prototype[method] !== 'function') {
                    throw new Error(`MainScene class is missing method: ${method}`);
                }
            }
        });
        
        // Test 9: Game initialization
        tests.addTest('Game can be initialized', () => {
            if (typeof game === 'undefined') {
                throw new Error('Game instance is not created');
            }
            // Note: We can't fully test this without a proper DOM element
        });
        
        // Test 10: Utility functions
        tests.addTest('Utility functions work correctly', () => {
            // Test formatTime
            if (typeof MainScene.prototype.formatTime !== 'function') {
                throw new Error('formatTime method not found');
            }
            
            // Create a mock instance to test
            const mockScene = {
                formatTime: MainScene.prototype.formatTime
            };
            
            const result1 = mockScene.formatTime(90);
            if (result1 !== '1:30') {
                throw new Error(`formatTime(90) returned ${result1}, expected 1:30`);
            }
            
            const result2 = mockScene.formatTime(65);
            if (result2 !== '1:05') {
                throw new Error(`formatTime(65) returned ${result2}, expected 1:05`);
            }
            
            const result3 = mockScene.formatTime(45);
            if (result3 !== '0:45') {
                throw new Error(`formatTime(45) returned ${result3}, expected 0:45`);
            }
        });
        
        // Run tests after a delay to allow Phaser to load
        window.addEventListener('load', () => {
            setTimeout(() => {
                tests.run();
            }, 1000);
        });
        
        // Also try to initialize a test game
        window.addEventListener('load', () => {
            try {
                const testConfig = {
                    type: Phaser.AUTO,
                    width: 800,
                    height: 600,
                    parent: 'game-container',
                    backgroundColor: '#87CEEB',
                    physics: { default: 'arcade', arcade: { gravity: { y: 400 }, debug: false } },
                    scene: [MainScene]
                };
                
                // Only create if one doesn't exist
                if (typeof game === 'undefined') {
                    const testGame = new Phaser.Game(testConfig);
                    console.log('Test game initialized successfully');
                }
            } catch (e) {
                console.error('Failed to initialize test game:', e);
                document.getElementById('test-results').innerHTML += 
                    `<div class="test fail">✗ Game initialization failed: ${e.message}</div>`;
            }
        });
    </script>
    
    <!-- Include the game code inline for testing -->
    <script>
        // ========== CONFIG ==========
        const CONFIG = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game',
            backgroundColor: '#87CEEB',
            physics: { default: 'arcade', arcade: { gravity: { y: 400 }, debug: false } },
            scene: []
        };

        // ========== CANNONBALLS ==========
        const CANNONBALLS = {
            small: { radius: 8, damage: 10, mass: 1, color: 0x333333, drag: 0.98, label: 'S' },
            medium: { radius: 12, damage: 25, mass: 2, color: 0x222222, drag: 0.96, label: 'M' },
            large: { radius: 18, damage: 50, mass: 4, color: 0x111111, drag: 0.94, label: 'L' }
        };

        // ========== CASTLES ==========
        const CASTLES = [
            {
                name: 'Neuschwanstein',
                colors: { stone: 0xE8D5B7, roof: 0x8B4513, detail: 0x5D4037, window: 0x2E7D32 },
                difficulty: 1.2,
                draw: function(scene, x, y) {
                    const g = scene.add.graphics();
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x, y - 200, 80, 200);
                    g.lineStyle(2, this.colors.detail);
                    g.strokeRect(x, y - 200, 80, 200);
                    g.fillStyle(this.colors.roof, 1);
                    g.beginPath();
                    g.moveTo(x - 5, y - 200);
                    g.lineTo(x + 40, y - 260);
                    g.lineTo(x + 85, y - 200);
                    g.closePath();
                    g.fillPath();
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 80, y - 120, 60, 120);
                    g.fillRect(x + 80, y - 120, 60, 120);
                    g.fillStyle(this.colors.roof, 1);
                    g.beginPath();
                    g.moveTo(x - 80, y - 120);
                    g.lineTo(x - 50, y - 180);
                    g.lineTo(x - 20, y - 120);
                    g.closePath();
                    g.fillPath();
                    g.beginPath();
                    g.moveTo(x + 80, y - 120);
                    g.lineTo(x + 110, y - 180);
                    g.lineTo(x + 140, y - 120);
                    g.closePath();
                    g.fillPath();
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 60, y - 60, 200, 30);
                    g.fillStyle(this.colors.window, 1);
                    for (let i = 0; i < 3; i++) {
                        g.fillRect(x + 10 + i * 20, y - 180 + i * 30, 10, 15);
                        g.fillRect(x + 40 + i * 20, y - 180 + i * 30, 10, 15);
                    }
                    return g;
                }
            },
            {
                name: 'Schönbrunn',
                colors: { stone: 0xF5E6D3, roof: 0x4E342E, detail: 0x3E2723, window: 0x1B5E20 },
                difficulty: 1.0,
                draw: function(scene, x, y) {
                    const g = scene.add.graphics();
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 100, y - 100, 200, 100);
                    g.lineStyle(2, this.colors.detail);
                    g.strokeRect(x - 100, y - 100, 200, 100);
                    g.fillStyle(this.colors.roof, 1);
                    g.fillRect(x - 110, y - 100, 220, 20);
                    g.beginPath();
                    g.moveTo(x - 110, y - 100);
                    g.lineTo(x - 120, y - 120);
                    g.lineTo(x + 120, y - 120);
                    g.lineTo(x + 110, y - 100);
                    g.closePath();
                    g.fillPath();
                    g.fillStyle(this.colors.stone, 1);
                    g.fillRect(x - 180, y - 60, 80, 60);
                    g.fillRect(x + 100, y - 60, 80, 60);
                    g.fillStyle(this.colors.detail, 1);
                    for (let i = 0; i < 3; i++) {
                        g.fillRect(x - 80 + i * 40, y - 100, 5, 30);
                        g.fillRect(x - 85 + i * 40, y - 100, 15, 5);
                    }
                    g.fillStyle(this.colors.window, 1);
                    for (let i = 0; i < 5; i++) {
                        g.fillRect(x - 90 + i * 40, y - 80, 12, 18);
                        g.fillRect(x - 90 + i * 40, y - 40, 12, 18);
                    }
                    g.fillStyle(0x2E8B57, 0.4);
                    g.fillRect(x - 150, y, 300, 40);
                    return g;
                }
            }
        ];

        // ========== MINI-GAMES ==========
        const MINI_GAMES = [
            { id: 'trivia', name: 'Castle Trivia', icon: '📚' },
            { id: 'reflex', name: 'Quick Reflex', icon: '🎯' }
        ];

        const TRIVIA = [
            { q: "Which castle inspired Disney's Sleeping Beauty?", a: ["Neuschwanstein","Edinburgh","Himeji","Windsor"], correct: 0 },
            { q: "Where is Schönbrunn Palace?", a: ["Germany","Austria","France","Italy"], correct: 1 },
            { q: "What style is Neuschwanstein?", a: ["Baroque","Romanesque","Gothic Revival","Renaissance"], correct: 2 }
        ];

        // ========== MAIN SCENE ==========
        class MainScene extends Phaser.Scene {
            constructor() { super({ key: 'MainScene' }); }

            create() {
                this.state = {
                    score: 0, castles: 0, time: 120, maxTime: 120, active: true,
                    ballSize: 'medium', powder: 0, maxPowder: 100
                };

                this.physics.world.setBounds(0, 0, 800, 600);
                this.input.on('pointerdown', this.onPointerDown, this);
                this.input.on('pointermove', this.onPointerMove, this);
                this.input.on('pointerup', this.onPointerUp, this);

                this.createBG();
                this.createCastle();
                this.createCannon();
                this.createUI();
                this.createTimer();
                this.createMiniGameBtn();

                this.dragging = false;
            }

            createBG() {
                const g = this.add.graphics();
                g.fillGradientStyle(0x87CEEB, 0x87CEEB, 0xE0F7FF, 0xE0F7FF);
                g.fillRect(0, 0, 800, 600);
                g.fillStyle(0x228B22);
                g.fillRect(0, 500, 800, 100);
            }

            createCastle() {
                this.castleIdx = 0;
                this.castle = new Castle(this, CASTLES[this.castleIdx]);
            }

            createCannon() {
                const base = this.add.graphics();
                base.fillStyle(0x5C4033);
                base.fillRect(60, 490, 80, 30);
                base.fillCircle(75, 520, 15);
                base.fillCircle(125, 520, 15);

                this.barrel = this.add.graphics();
                this.barrel.fillStyle(0x2F4F4F);
                this.barrel.fillRect(0, -10, 80, 20);
                this.barrel.setPosition(140, 500);
                
                this.angle = -0.3;
                this.updateBarrel();

                this.powderBtn = this.add.graphics();
                this.powderBtn.fillStyle(0x8B4513);
                this.powderBtn.fillRect(20, 450, 40, 50);
                this.powderBtn.setInteractive(new Phaser.Geom.Rectangle(0,0,40,50));
                this.powderBtn.on('pointerdown', () => this.addPowder(10));
                this.add.text(40, 475, '💣');

                this.ballBtns = {};
                ['small','medium','large'].forEach((s,i) => {
                    const x = 150 + i * 60;
                    const btn = this.add.graphics();
                    btn.fillStyle(this.state.ballSize === s ? 0xFFD700 : 0xC0C0C0);
                    btn.fillCircle(x, 550, 25);
                    btn.setInteractive(new Phaser.Geom.Circle(x,550,25));
                    btn.on('pointerdown', () => this.setBall(s));
                    this.add.text(x, 550, CANNONBALLS[s].label, {font:'20px Arial',fill:'#000'}).setOrigin(0.5);
                    this.ballBtns[s] = btn;
                });

                this.fireBtn = this.add.graphics();
                this.fireBtn.fillStyle(0xFF4500);
                this.fireBtn.fillCircle(0, 0, 25);
                this.fireBtn.setInteractive(new Phaser.Geom.Circle(0,0,25));
                this.fireBtn.on('pointerdown', () => this.fire());
                this.fireBtn.setVisible(false);
                this.updateFireBtn();
            }

            updateBarrel() {
                this.barrel.setRotation(this.angle);
            }

            updateFireBtn() {
                const l = 80;
                const x = 140 + Math.cos(this.angle) * l;
                const y = 500 + Math.sin(this.angle) * l;
                this.fireBtn.setPosition(x, y);
                this.fireBtn.setVisible(this.state.powder > 0);
            }

            createUI() {
                this.scoreTxt = this.add.text(20, 20, `Score: ${this.state.score}`, {font:'20px Arial',fill:'#000'});
                this.castleTxt = this.add.text(20, 50, `Castles: ${this.state.castles}`, {font:'20px Arial',fill:'#000'});
                this.powderTxt = this.add.text(150, 430, `Powder: ${this.state.powder}%`, {font:'16px Arial',fill:'#000'}).setOrigin(0.5);
                this.ballTxt = this.add.text(150, 460, `Ball: ${this.state.ballSize.toUpperCase()}`, {font:'16px Arial',fill:'#000'}).setOrigin(0.5);
            }

            createTimer() {
                this.timerTxt = this.add.text(700, 20, this.formatTime(this.state.time), {font:'24px Arial',fill:'#000'});
                this.fireStick = this.add.graphics();
                this.fireStick.fillStyle(0xFF4500);
                this.fireStick.fillRect(700, 50, 20, 120);
                this.fireBurn = this.add.graphics();
                this.fireBurn.fillStyle(0xFF8C00);
                this.fireBurn.fillRect(700, 50, 20, 0);
                this.add.text(700, 80, '🔥');

                this.time.addEvent({delay:1000,callback:()=>{
                    if (!this.state.active) return;
                    this.state.time--;
                    if (this.state.time <= 0) {
                        this.state.active = false;
                        this.scene.restart();
                        return;
                    }
                    this.timerTxt.setText(this.formatTime(this.state.time));
                    const p = (this.state.maxTime - this.state.time) / this.state.maxTime;
                    this.fireBurn.clear();
                    this.fireBurn.fillStyle(this.state.time <= 10 ? 0xFF0000 : 0xFF8C00);
                    this.fireBurn.fillRect(700, 50, 20, 120 * p);
                },loop:true});
            }

            formatTime(s) {
                const m = Math.floor(s/60);
                const sec = s%60;
                return `${m}:${sec.toString().padStart(2,'0')}`;
            }

            createMiniGameBtn() {
                const btn = this.add.graphics();
                btn.fillStyle(0x4CAF50);
                btn.fillRoundedRect(750, 550, 120, 40, 5);
                btn.setInteractive(new Phaser.Geom.Rectangle(0,0,120,40));
                btn.on('pointerdown', () => this.startMiniGame());
                this.add.text(750, 550, 'Mini-Game', {font:'16px Arial',fill:'#fff'}).setOrigin(0.5);
            }

            startMiniGame() {
                this.state.active = false;
                const games = [MINI_GAMES[0]];
                this.showTrivia(games[0]);
            }

            showTrivia(game) {
                this.overlay = this.add.graphics();
                this.overlay.fillStyle(0x000000, 0.8);
                this.overlay.fillRect(0, 0, 800, 600);

                this.add.text(400, 100, game.name, {font:'32px Arial',fill:'#FFD700'}).setOrigin(0.5);
                
                const q = TRIVIA[Math.floor(Math.random()*TRIVIA.length)];
                this.add.text(400, 200, q.q, {font:'20px Arial',fill:'#fff',wordWrap:{width:600}}).setOrigin(0.5);

                q.a.forEach((a,i) => {
                    const btn = this.add.graphics();
                    btn.fillStyle(0x3498DB);
                    btn.fillRoundedRect(400, 280+i*60, 500, 40, 5);
                    btn.setInteractive(new Phaser.Geom.Rectangle(0,0,500,40));
                    btn.on('pointerdown', () => this.checkAnswer(i, q.correct, btn));
                    this.add.text(400, 280+i*60, a, {font:'18px Arial',fill:'#fff',wordWrap:{width:480}}).setOrigin(0.5);
                });

                const back = this.add.graphics();
                back.fillStyle(0xF44336);
                back.fillRoundedRect(750, 550, 120, 40, 5);
                back.setInteractive(new Phaser.Geom.Rectangle(0,0,120,40));
                back.on('pointerdown', () => this.closeMiniGame());
                this.add.text(750, 550, 'Back', {font:'16px Arial',fill:'#fff'}).setOrigin(0.5);
            }

            checkAnswer(selected, correct, btn) {
                if (selected === correct) {
                    btn.fillStyle(0x2ECC71);
                    this.time.delayedCall(1000, () => {
                        this.closeMiniGame();
                        this.state.time += 15;
                        this.state.active = true;
                    });
                } else {
                    btn.fillStyle(0xE74C3C);
                    this.time.delayedCall(1000, () => this.closeMiniGame());
                }
            }

            closeMiniGame() {
                this.overlay.destroy();
                this.children.each(c => { if (c !== this && c !== this.overlay) c.destroy(); });
                this.state.active = true;
                this.createUI();
                this.createTimer();
                this.createMiniGameBtn();
            }

            onPointerDown(pointer) {
                const bounds = this.barrel.getBounds();
                if (bounds.contains(pointer.x, pointer.y)) {
                    this.dragging = true;
                    this.dragStartY = pointer.y;
                    this.initialAngle = this.angle;
                }
            }

            onPointerMove(pointer) {
                if (this.dragging) {
                    const delta = pointer.y - this.dragStartY;
                    this.angle = Phaser.Math.Clamp(this.initialAngle + delta * 0.005, -1.2, 0.8);
                    this.updateBarrel();
                    this.updateFireBtn();
                }
            }

            onPointerUp() {
                this.dragging = false;
            }

            addPowder(amount) {
                if (!this.state.active) return;
                this.state.powder = Math.min(this.state.powder + amount, this.state.maxPowder);
                this.powderTxt.setText(`Powder: ${Math.round(this.state.powder)}%`);
            }

            setBall(size) {
                if (!this.state.active) return;
                this.state.ballSize = size;
                Object.keys(this.ballBtns).forEach(s => {
                    this.ballBtns[s].clear();
                    this.ballBtns[s].fillStyle(this.state.ballSize === s ? 0xFFD700 : 0xC0C0C0);
                    this.ballBtns[s].fillCircle(this.ballBtns[s].x, this.ballBtns[s].y, 25);
                });
                this.ballTxt.setText(`Ball: ${this.state.ballSize.toUpperCase()}`);
            }

            fire() {
                if (!this.state.active || this.state.powder <= 0) return;

                const cfg = CANNONBALLS[this.state.ballSize];
                const l = 80;
                const sx = 140 + Math.cos(this.angle) * l;
                const sy = 500 + Math.sin(this.angle) * l;
                const power = this.state.powder / 100;
                const velocity = power * 600;

                const ball = this.add.graphics();
                ball.fillStyle(cfg.color);
                ball.fillCircle(0, 0, cfg.radius);
                ball.setPosition(sx, sy);

                this.physics.add.existing(ball);
                ball.body.setCircle(cfg.radius);
                ball.body.setMass(cfg.mass);
                ball.body.setDrag(cfg.drag);
                ball.body.setVelocity(
                    Math.cos(this.angle) * velocity,
                    Math.sin(this.angle) * velocity
                );

                ball.damage = cfg.damage * power;

                this.state.powder = 0;
                this.powderTxt.setText('Powder: 0%');
                this.fireBtn.setVisible(false);

                const flash = this.add.graphics();
                flash.fillStyle(0xFFFF00, 0.8);
                flash.fillCircle(sx, sy, 15);
                this.tweens.add({targets:flash, radius:0, alpha:0, duration:200, onComplete:()=>flash.destroy()});

                this.physics.add.collider(ball, this.castle.parts, (b,p) => this.hitCastle(b));
                this.physics.add.collider(ball, this.physics.world.bounds, () => {
                    const dust = this.add.graphics();
                    dust.fillStyle(0x8B4513, 0.7);
                    dust.fillEllipse(b.x, b.y, 25, 15);
                    this.tweens.add({targets:dust, alpha:0, scale:1.5, duration:300, onComplete:()=>dust.destroy()});
                    b.destroy();
                });

                this.time.delayedCall(500, () => this.updateFireBtn());
            }

            hitCastle(ball) {
                this.castle.takeDamage(ball.damage);
                const hit = this.add.graphics();
                hit.fillStyle(0xFF4500, 0.8);
                hit.fillCircle(ball.x, ball.y, 10);
                this.tweens.add({targets:hit, radius:25, alpha:0, duration:200, onComplete:()=>hit.destroy()});
                ball.destroy();
                this.state.score += Math.floor(ball.damage * 0.5);
                this.scoreTxt.setText(`Score: ${this.state.score}`);
            }
        }

        // ========== CASTLE CLASS ==========
        class Castle {
            constructor(scene, type) {
                this.scene = scene;
                this.type = type;
                this.health = 100 * type.difficulty;
                this.maxHealth = this.health;
                this.x = 600;
                this.y = 300;
                this.parts = [];
                this.create();
            }

            create() {
                const castle = this.type.draw(this.scene, this.x, this.y);
                this.parts.push(castle);

                this.hpBg = this.scene.add.graphics();
                this.hpBg.fillStyle(0x000000, 0.5);
                this.hpBg.fillRoundedRect(this.x - 50, this.y - 150, 100, 10, 5);
                this.hpBar = this.scene.add.graphics();
                this.hpBar.fillStyle(0x00FF00);
                this.hpBar.fillRoundedRect(this.x - 50, this.y - 150, 100, 10, 5);
            }

            takeDamage(dmg) {
                this.health -= dmg;
                const p = (this.health / this.maxHealth) * 100;
                this.hpBar.clear();
                this.hpBar.fillStyle(p < 30 ? 0xFF0000 : p < 60 ? 0xFFA500 : 0x00FF00);
                this.hpBar.fillRoundedRect(this.x - 50, this.y - 150, p, 10, 5);

                this.parts.forEach(p => {
                    this.scene.tweens.add({targets:p, x:p.x+Phaser.Math.Between(-3,3), y:p.y+Phaser.Math.Between(-3,3), duration:50, yoyo:true});
                });

                if (this.health <= 0) this.destroy();
            }

            destroy() {
                const main = this.scene.scene.getScene('MainScene');
                if (main) {
                    main.state.score += 100 * this.type.difficulty;
                    main.state.castles++;
                    main.scoreTxt.setText(`Score: ${main.state.score}`);
                    main.castleTxt.setText(`Castles: ${main.state.castles}`);
                    main.time.delayedCall(1000, () => {
                        main.castleIdx = (main.castleIdx + 1) % CASTLES.length;
                        main.castle.destroy();
                        main.castle = new Castle(main, CASTLES[main.castleIdx]);
                    });
                }
                this.parts.forEach(p => p.destroy());
                this.hpBar.destroy();
                this.hpBg.destroy();
            }
        }
    </script>
